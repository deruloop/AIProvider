# macOS demo app, generated with XcodeGen:
#     cd Examples/macOSDemo && xcodegen generate
#
# ⚠️  The committed macOSDemo.xcodeproj is the source of truth and is
# hand-patched: XcodeGen 2.33 emits the local Swift package as a legacy folder
# reference (no XCLocalSwiftPackageReference), which Xcode 27 rejects with
# "Missing package product". The committed project references the package the
# modern way (XCLocalSwiftPackageReference, relativePath "../.."). If you
# regenerate, re-apply that fix afterwards (or use a newer XcodeGen).
#
# This is the signed counterpart to the iOS demo: same shared chat UI
# (VoltaSDKDemoUI), so it shows the full provider chain — including Private
# Cloud Compute on macOS 27. PCC is OPT-IN (see the entitlement note below).
#
# This demo also wires an OFFICIAL VENDOR PACKAGE into the chain
# (Anthropic's ClaudeForFoundationModels via AIConfiguration.customModels) —
# which is why it deploys to macOS 27 (the vendor package requires OS 27;
# the shared VoltaSDK package itself still deploys from 26, and iOSDemo is
# unchanged).
name: macOSDemo
options:
  bundleIdPrefix: com.voltasdk.demo
  deploymentTarget:
    macOS: "27.0"      # ClaudeForFoundationModels requires macOS 27
packages:
  VoltaSDK:
    path: ../..
  # ── ClaudeForFoundationModels: PARKED (beta version skew) ────────────────
  # Anthropic's package tracks the LATEST Xcode 27 beta SDK, and version skew
  # breaks the build in both directions (observed live: 0.1.4 targets beta 3 —
  # it failed against beta 2's SDK on SamplingMode shapes AND against beta 5's
  # on Transcript.CustomSegment). Re-attach when Anthropic ships a release
  # matching your installed beta: uncomment here + the dependency below (or
  # just File > Add Package Dependencies… in Xcode). The app code is guarded
  # with `#if canImport(ClaudeForFoundationModels)` and lights up by itself.
  # ClaudeForFoundationModels:
  #   url: https://github.com/anthropics/ClaudeForFoundationModels.git
  #   from: 0.1.0
targets:
  macOSDemo:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: VoltaSDK
        product: VoltaSDKDemoUI
      # - package: ClaudeForFoundationModels
      #   product: ClaudeForFoundationModels
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.voltasdk.demo.macos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J6HPZ958W6
        # ── Private Cloud Compute: OPT-IN ─────────────────────────────────
        # Left unwired so this demo builds for everyone (PCC just shows
        # "unavailable" and the chain falls back to on-device). To exercise
        # LIVE PCC: request the entitlement from Apple (see ../../README.md),
        # set your own DEVELOPMENT_TEAM above, then either add the "Private
        # Cloud Compute" capability in Xcode (Signing & Capabilities) or
        # uncomment the next line and re-run `xcodegen generate`:
        # CODE_SIGN_ENTITLEMENTS: macOSDemo.entitlements
schemes:
  macOSDemo:
    build:
      targets:
        macOSDemo: all
    run:
      config: Debug
